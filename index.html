<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeavyHo</title>
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HeavyHo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<nav id="tabbar" class="tabbar">
  <button class="tab-btn" data-tab="train">
    <span class="tab-icon" aria-hidden="true">🏋️</span><span>Train</span>
  </button>
  <button class="tab-btn" data-tab="routine">
    <span class="tab-icon" aria-hidden="true">📋</span><span>Routine</span>
  </button>
  <button class="tab-btn" data-tab="history">
    <span class="tab-icon" aria-hidden="true">📈</span><span>History</span>
  </button>
  <button class="tab-btn" data-tab="settings">
    <span class="tab-icon" aria-hidden="true">⚙️</span><span>Settings</span>
  </button>
</nav>
<input type="file" id="import-file-input" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
